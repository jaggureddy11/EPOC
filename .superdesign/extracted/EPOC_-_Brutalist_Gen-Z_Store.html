<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPOC - Brutalist Premium Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=satoshi@700,900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#DA3C2F',
              cream: '#F4E7DA',
              dark: '#0f0f0f',
              purple: '#3a0c2e'
            }
          },
          fontFamily: {
            display: ['Tanker', 'sans-serif'],
            body: ['Satoshi', 'sans-serif'],
          },
          boxShadow: {
            'brutal': '16px 16px 0px 0px #0f0f0f',
            'brutal-cream': '12px 12px 0px 0px #F4E7DA',
            'brutal-red': '12px 12px 0px 0px #DA3C2F',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #DA3C2F;
      background-image: radial-gradient(#F4E7DA 2px, transparent 2px);
      background-size: 40px 40px;
    }
    .stroke-text {
      -webkit-text-stroke: 2px #F4E7DA;
      color: transparent;
    }
    .stroke-text-dark {
      -webkit-text-stroke: 2px #0f0f0f;
      color: transparent;
    }
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-content {
      display: inline-block;
      animation: marquee 15s linear infinite;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body class="text-brand-dark font-body antialiased selection:bg-brand-dark selection:text-brand-cream overflow-x-hidden">

  <nav class="fixed top-0 w-full z-50 bg-brand-cream border-b-8 border-brand-dark px-6 py-4">
    <div class="max-w-[1440px] mx-auto flex items-center justify-between">
      <a href="#" class="block hover:-translate-y-1 transition-transform">
        <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/uploads/ae52f364-29ad-4a1c-8745-c4863ce23c5d/1791208709971-1734bdc7/image.png" alt="EPOC" class="h-12 w-auto border-4 border-brand-dark shadow-brutal">
      </a>
      <div class="hidden lg:flex gap-12 font-display text-4xl uppercase tracking-widest">
        <a href="#" class="hover:text-brand-red hover:underline decoration-8 underline-offset-8">Manifesto</a>
        <a href="#" class="hover:text-brand-red hover:underline decoration-8 underline-offset-8">Objects</a>
        <a href="#" class="hover:text-brand-red hover:underline decoration-8 underline-offset-8">Chaos</a>
      </div>
      <div class="flex gap-6">
        <button class="w-16 h-16 bg-brand-red border-4 border-brand-dark shadow-brutal flex items-center justify-center hover:translate-x-1 hover:translate-y-1 hover:shadow-none transition-all">
          <iconify-icon icon="lucide:shopping-cart" class="text-3xl text-brand-cream"></iconify-icon>
        </button>
      </div>
    </div>
  </nav>

  <main class="pt-32">
    <section class="min-h-screen px-6 py-12 flex flex-col justify-center relative overflow-hidden">
      <div class="absolute top-1/4 -left-20 w-96 h-96 bg-brand-purple mix-blend-multiply opacity-50 blur-3xl"></div>
      <div class="absolute bottom-1/4 -right-20 w-[600px] h-[600px] bg-brand-dark mix-blend-multiply opacity-40 blur-3xl"></div>

      <div class="max-w-[1440px] mx-auto w-full relative z-10">
        <h1 class="font-display text-[12vw] leading-[0.8] uppercase font-black text-brand-cream text-center mb-8 mix-blend-difference">
          <span class="block">Anti</span>
          <span class="block stroke-text">Aesthetic</span>
        </h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-16">
          <div class="bg-brand-cream border-8 border-brand-dark p-8 shadow-brutal transform -rotate-2 hover:rotate-0 transition-transform">
            <h2 class="font-display text-5xl uppercase mb-4">Raw Form</h2>
            <p class="text-xl font-bold leading-tight uppercase">We reject the clean. We embrace the noise. Objects designed for the bold.</p>
          </div>
          <div class="lg:col-span-2 bg-brand-dark border-8 border-brand-cream p-8 shadow-brutal-cream transform rotate-1 hover:rotate-0 transition-transform flex items-center justify-center overflow-hidden relative">
             <img src="https://images.unsplash.com/photo-1540932239986-30128078f3c5?auto=format&fit=crop&w=1200&q=80" alt="Abstract" class="absolute inset-0 w-full h-full object-cover opacity-50 grayscale contrast-150 mix-blend-luminosity">
             <h2 class="font-display text-7xl uppercase text-brand-cream relative z-10 text-center stroke-text-dark mix-blend-difference">Premium<br>Chaos</h2>
          </div>
        </div>
      </div>
    </section>

    <div class="marquee-container bg-brand-dark border-y-8 border-brand-cream py-6">
      <div class="marquee-content font-display text-6xl uppercase text-brand-cream flex gap-16">
        <span>Consume</span>
        <iconify-icon icon="ph:warning-duotone" class="text-brand-red"></iconify-icon>
        <span>Destroy</span>
        <iconify-icon icon="ph:warning-duotone" class="text-brand-red"></iconify-icon>
        <span>Rebuild</span>
        <iconify-icon icon="ph:warning-duotone" class="text-brand-red"></iconify-icon>
        <span>Consume</span>
        <iconify-icon icon="ph:warning-duotone" class="text-brand-red"></iconify-icon>
        <span>Destroy</span>
        <iconify-icon icon="ph:warning-duotone" class="text-brand-red"></iconify-icon>
        <span>Rebuild</span>
      </div>
    </div>

    <section class="py-32 px-6">
      <div class="max-w-[1440px] mx-auto grid grid-cols-1 md:grid-cols-2 gap-16">
        <div class="relative group">
          <div class="absolute inset-0 bg-brand-purple translate-x-4 translate-y-4 border-8 border-brand-dark"></div>
          <div class="relative bg-brand-cream border-8 border-brand-dark h-[600px] overflow-hidden group-hover:-translate-y-4 group-hover:-translate-x-4 transition-transform duration-300">
            <img src="https://images.unsplash.com/photo-1507149833265-60c372daea22?auto=format&fit=crop&w=800&q=80" alt="Product" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500">
            <div class="absolute bottom-0 left-0 w-full bg-brand-red border-t-8 border-brand-dark p-6 flex justify-between items-end translate-y-full group-hover:translate-y-0 transition-transform duration-300">
              <h3 class="font-display text-4xl uppercase text-brand-cream">Steel Chair</h3>
              <span class="font-display text-5xl text-brand-dark">$890</span>
            </div>
          </div>
        </div>

        <div class="relative group mt-16 md:mt-32">
           <div class="absolute inset-0 bg-brand-dark translate-x-4 translate-y-4 border-8 border-brand-cream"></div>
          <div class="relative bg-brand-red border-8 border-brand-dark h-[600px] overflow-hidden group-hover:-translate-y-4 group-hover:-translate-x-4 transition-transform duration-300">
            <img src="https://images.unsplash.com/photo-1579562768051-40915654cc3c?auto=format&fit=crop&w=800&q=80" alt="Product" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500 mix-blend-multiply opacity-80">
            <div class="absolute bottom-0 left-0 w-full bg-brand-cream border-t-8 border-brand-dark p-6 flex justify-between items-end translate-y-full group-hover:translate-y-0 transition-transform duration-300">
              <h3 class="font-display text-4xl uppercase text-brand-dark">Brutalist Vase</h3>
              <span class="font-display text-5xl text-brand-red">$140</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-brand-dark text-brand-cream border-t-8 border-brand-cream px-6 py-24">
    <div class="max-w-[1440px] mx-auto text-center">
      <h2 class="font-display text-[15vw] leading-none uppercase stroke-text hover:text-brand-red transition-colors cursor-pointer">EPOC</h2>
      <p class="font-display text-3xl uppercase tracking-[0.5em] mt-8 text-brand-red">End of an era.</p>
    </div>
  </footer>

</body>
</html>
