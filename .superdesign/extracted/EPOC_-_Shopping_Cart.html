  <style>
    body {
      background-color: #DA3C2F;
      background-image: radial-gradient(#F4E7DA 2px, transparent 2px);
      background-size: 40px 40px;
    }
    .stroke-text {
      -webkit-text-stroke: 2px #F4E7DA;
      color: transparent;
    }
    .stroke-text-dark {
      -webkit-text-stroke: 2px #0f0f0f;
      color: transparent;
    }
    .marquee-container {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .marquee-content {
      display: inline-flex;
      animation: marquee 10s linear infinite;
    }
    .marquee-content span {
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .marquee-content span:hover {
      transform: scale(1.3) rotate(3deg);
      color: #0f0f0f;
      -webkit-text-stroke: 1px #F4E7DA;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes pulse-breathe {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.75; }
    }
    .breathe-img {
      animation: pulse-breathe 3s ease-in-out infinite;
    }
    @keyframes fade-in-up-scale {
      0% { opacity: 0; transform: translateY(80px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .stagger-1 { animation: fade-in-up-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s both; }
    .stagger-2 { animation: fade-in-up-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both; }
    .stagger-3 { animation: fade-in-up-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.5s both; }
    .stagger-4 { animation: fade-in-up-scale 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.7s both; }
    
    .glitch-hover:hover {
      animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
      text-shadow: 4px 4px #DA3C2F, -4px -4px #0f0f0f;
      color: #F4E7DA;
    }
    @keyframes glitch-skew {
      0% { transform: skew(0deg); }
      20% { transform: skew(-15deg); }
      40% { transform: skew(15deg); }
      60% { transform: skew(-5deg); }
      80% { transform: skew(5deg); }
      100% { transform: skew(0deg); }
    }
    
    .violent-hover {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .violent-hover:hover {
      transform: scale(1.08) translate(-6px, -6px) rotate(2deg) !important;
      box-shadow: 24px 24px 0px 0px #0f0f0f !important;
      z-index: 20;
    }
    
    .cascading-shadow {
      box-shadow: 8px 8px 0px 0px #F4E7DA, 16px 16px 0px 0px #0f0f0f, 24px 24px 0px 0px #DA3C2F, 32px 32px 0px 0px #3a0c2e;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cascading-shadow:hover {
      transform: scale(1.05) translate(-12px, -12px);
      box-shadow: 16px 16px 0px 0px #F4E7DA, 32px 32px 0px 0px #0f0f0f, 48px 48px 0px 0px #DA3C2F, 64px 64px 0px 0px #3a0c2e;
      z-index: 30;
    }
    
    @keyframes dash {
      from { stroke-dashoffset: 40; }
      to { stroke-dashoffset: 0; }
    }
    .dash-line {
      stroke-dasharray: 20, 20;
      animation: dash 1s linear infinite;
    }
  </style>
</head>
